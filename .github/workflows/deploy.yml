name: Deploy Automatico no Servidor

on:
  push:
    branches:
      - main  # Altere para 'master' se for o nome da sua branch principal

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Atualizar código no servidor
        run: |
          cd /caminho/completo/do/seu/projeto
          git pull origin main
          # Adicione aqui comandos adicionais de build/restart se necessário