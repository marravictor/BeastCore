name: Deploy Automatico no Servidor

on:
  push:
    branches:
      - main  # Altere para 'master' se a sua branch principal tiver esse nome

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Atualizar código no servidor
        run: |
          cd /var/www/html/BeastCore
          git pull origin main