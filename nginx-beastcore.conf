# Copie este arquivo para /etc/nginx/sites-available/beastcore
# Depois: sudo ln -s /etc/nginx/sites-available/beastcore /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name SEU_IP_OU_DOMINIO;  # troque pelo IP ou domínio

    root /var/www/html/BeastCore;
    index index.php;

    # Logs
    access_log /var/log/nginx/beastcore_access.log;
    error_log /var/log/nginx/beastcore_error.log;

    # Arquivos estáticos (css, js, imagens)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Tudo passa pelo index.php (permite URLs amigáveis se quiser no futuro)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP - ESSENCIAL PARA FUNCIONAR
    # AJUSTE: verifique com: ls /run/php/php*-fpm.sock
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;  # <-- MUDE AQUI (ex: php8.1, php8.2, php8.3)
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
    }

    # Bloqueia acesso a arquivos sensíveis
    location ~ /\.(env|git|gitignore|sql)$ {
        deny all;
    }
    
    location ~ /database/ {
        deny all;
    }
    
    location ~ /includes/ {
        deny all;
    }
}