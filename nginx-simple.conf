# Config nginx SIMPLES para BeastCore
# Copie para: /etc/nginx/sites-available/beastcore
# sudo ln -s /etc/nginx/sites-available/beastcore /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;
    root /var/www/html/BeastCore;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;  # mude para sua versão: php8.1, php8.2, php8.3
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}